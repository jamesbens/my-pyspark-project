services:
  spark-master:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-master.sh
    env_file: .env
    environment:
      - SPARK_NO_DAEMONIZE=true
    volumes:
      # Maps current directory on Windows to /opt/spark/bin/spark-submit inside the container
      - .:/opt/spark/work-dir
      #- .:/app
    ports:
      - "8080:8080" #web ui port
      - "7077:7077" #communication port between master and workers

  spark-worker-1:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    env_file: .env
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    env_file: .env
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master

  spark-worker-3:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    env_file: .env
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master


  spark-worker-4:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    env_file: .env
    environment:
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master