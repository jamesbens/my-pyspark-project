services:
  spark-master:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-master.sh
    env_file: .env
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_LOCAL_HOSTNAME=spark-master
      - SPARK_NO_DAEMONIZE=true
        # Permanently exposes PySpark and Py4J to system python3
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip
      # To avoid setting spark.jars.ivy in every script or command, configure the Ivy path
      - SPARK_SUBMIT_OPTS=-Divy.home=/tmp/.ivy2

    volumes:
      # Maps current directory on Windows to /opt/spark/bin/spark-submit inside the container
      - .:/opt/spark/work-dir
      #- .:/app
    ports:
      - "18080:8080" #web ui port
      - "7077:7077" #communication port between master and workers
      - "4040:4040" #maps your computer's local port 4040 to port 4040 inside the Docker container, exposing the Spark Application Web UI

  spark-worker-1:
    image: apache/spark:4.2.0
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077 --cores 2 --memory 1g
    env_file: .env
    environment:
      - SPARK_MASTER_HOST=spark-worker-1
      - SPARK_LOCAL_HOSTNAME=spark-worker-1
      - SPARK_NO_DAEMONIZE=true
        # Permanently exposes PySpark and Py4J to system python3
      - PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip
      # To avoid setting spark.jars.ivy in every script or command, configure the Ivy path
      - SPARK_SUBMIT_OPTS=-Divy.home=/tmp/.ivy2
    depends_on:
      - spark-master

